<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" id="biodata" method="post">
        <table width="85%">
            <tr>
                <td width="50%" pattern="[A-Za-z]+">Username</td>
                <td width="50%"><input width="100%" align="center" type="text" name="username" id="username" placeholder="Masukkan username anda, Tidak boleh ada spasi"></td>
            </tr>
            <tr>
                <td width="50%">Email</td>
                <td width="50%"><input type="email" name="email" id="email"></td>
            </tr>
            <tr>
                <td>Jenis Kelamin</td>
                <td>
                    <input type="radio" name="jkel" id="" value="pria" checked>Pria
                    <input type="radio" name="jkel" id="" value="wanita">Wanita
                </td>
            </tr>
            <tr>
                <td>Jurusan</td>
                <td>
                    <select name="" id="">
                        <optgroup label="FTD">
                            <option value="teknikinformatika">Teknik Informatika</option>
                            <option value="sistemkomputer">Sistem Komputer</option>
                            <option value="desainkomunikasivisual">Desain Komunikasi Visual</option>
                        </optgroup>
                        <optgroup label="FEB">
                            <option value="akutansi">Akutansi</option>
                            <option value="manajemen">Manajemen</option>
                        </optgroup>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Alamat</td>
                <td><textarea name="" id="" rows="3" cols="20"></textarea></td>
            </tr>
            <tr>
                <td>Tanggal Lahir</td>
                <td><input type="date" name="tanggallahir" id=""></td>
            </tr>
            <tr>
                <td width="50%">Password</td>
                <td width="50%"><input type="password" name="password" id="password"></td>
            </tr>
            <tr>
                <td width="50%">Confirm Password</td>
                <td width="50%"><input type="password" name="password" id="password"></td>
            </tr>
            <tr>
                <td>
                    <input type="submit" value="Kirim" name="cmdkirim">
                </td>
                <td>
                    <input type="reset" value="Reset" name="cmdbatal">
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
